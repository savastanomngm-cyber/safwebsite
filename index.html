const GRID=(()=>{const d=[];let x=new Date();while(d.length<400){const w=x.getDay();if(w!==0&&w!==6)d.unshift(new Date(x));x.setDate(x.getDate()-1);}return d;})();

async function fetchLive(t){const url="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(t)+"?range=1y&interval=1d";const px=u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u);try{const r=await fetch(px(url),{signal:AbortSignal.timeout(9000)});if(!r.ok)return null;const d=await r.json();const res=d.chart&&d.chart.result&&d.chart.result[0];if(!res)return null;const ts=res.timestamp||[],cl=((res.indicators||{}).quote||[{}])[0].close||[];const out=[];for(let i=0;i<ts.length;i++)if(cl[i]!=null)out.push({t:new Date(ts[i]*1000),p:cl[i]});return out.length>100?out:null;}catch(e){return null;}}

/* ═══ QUANT MATH ═══ */
function periodReturn(s,days){if(!s||s.length<2)return null;let base;if(days==="YTD"){const yr=s[s.length-1].t.getFullYear();const yp=s.filter(q=>q.t.getFullYear()===yr);if(yp.length<2)return null;base=yp[0].p;}else{const cut=new Date(s[s.length-1].t.getTime()-days*864e5);const v=s.filter(q=>q.t>=cut);if(v.length<2)return null;base=v[0].p;}return (s[s.length-1].p-base)/base*100;}
function maxDrawdown(s){let pk=-1e18,m=0;for(const q of s){if(q.p>pk)pk=q.p;const d=(q.p-pk)/pk;if(d<m)m=d;}return m*100;}
function pearson(x,y){const n=Math.min(x.length,y.length);if(n<61)return null;const a=x.slice(-n),b=y.slice(-n);const ra=[],rb=[];for(let i=1;i<n;i++){ra.push((a[i].p-a[i-1].p)/a[i-1].p);rb.push((b[i].p-b[i-1].p)/b[i-1].p);}let mx=0,my=0;for(let i=0;i<ra.length;i++){mx+=ra[i];my+=rb[i];}mx/=ra.length;my/=ra.length;let sxy=0,sx=0,sy=0;for(let i=0;i<ra.length;i++){const dx=ra[i]-mx,dy=rb[i]-my;sxy+=dx*dy;sx+=dx*dx;sy+=dy*dy;}return sx&&sy?sxy/Math.sqrt(sx*sy):null;}
const smaLast=(s,n)=>s.length<n?null:s.slice(-n).reduce((a,q)=>a+q.p,0)/n;
function rsiLast(s,p=14){if(s.length<p+1)return null;let g=0,l=0;for(let i=s.length-p;i<s.length;i++){const d=s[i].p-s[i-1].p;if(d>=0)g+=d;else l-=d;}g/=p;l/=p;return l===0?100:100-100/(1+g/l);}
function emaArr(v,k){const c=2/(k+1);const o=[v[0]];for(let i=1;i<v.length;i++)o.push(v[i]*c+o[i-1]*(1-c));return o;}
function macdLast(s){const c=s.map(q=>q.p);const e12=emaArr(c,12),e26=emaArr(c,26);const m=c.map((_,i)=>e12[i]-e26[i]);const sg=emaArr(m,9);return{macd:m.at(-1),signal:sg.at(-1),hist:m.at(-1)-sg.at(-1)};}
function indicators(s){const c=s.map(q=>q.p);const r=[];for(let i=1;i<c.length;i++)r.push((c[i]-c[i-1])/c[i-1]);const mean=r.reduce((a,b)=>a+b,0)/(r.length||1);const vol=Math.sqrt(r.reduce((a,b)=>a+(b-mean)**2,0)/(r.length||1))*Math.sqrt(252);const m20=smaLast(s,20);const std20=Math.sqrt(s.slice(-20).reduce((a,q)=>a+(q.p-m20)**2,0)/20);return{close:c.at(-1),sma20:m20,sma50:smaLast(s,50),sma200:smaLast(s,200),rsi:rsiLast(s),...macdLast(s),bbU:m20+2*std20,bbL:m20-2*std20,atr:s.length>15?Math.abs(c.at(-1)-c.at(-2)):0,annVol:vol,r5:periodReturn(s,5),r20:periodReturn(s,20)};}
function shadowAlphaScore(s,spy){if(!s||s.length<100)return null;const ytd=periodReturn(s,"YTD")||0,m1=periodReturn(s,30)||0;const above=s.at(-1).p>smaLast(s,50)?1:0;const trend=clamp(0,25,ytd*0.25+m1*0.25+above*8);let corr=pearson(s,spy);if(corr==null)corr=0.5;const indep=clamp(0,25,(1-Math.abs(corr))*30);const spyYtd=periodReturn(spy,"YTD")||0;const rs=clamp(0,25,(ytd-spyYtd)*0.4+12);const mdd=maxDrawdown(s);const c=s.map(q=>q.p);const r=[];for(let i=1;i<c.length;i++)r.push((c[i]-c[i-1])/c[i-1]);const vol=Math.sqrt(r.reduce((a,b)=>a+b*b,0)/r.length)*Math.sqrt(252);const stab=clamp(0,25,25-vol*25-Math.abs(mdd)*0.4);return{price:+c.at(-1).toFixed(2),ytd:+ytd.toFixed(2),correlation:+corr.toFixed(3),max_dd:+mdd.toFixed(2),trend:+trend.toFixed(1),independence:+indep.toFixed(1),rel_strength:+rs.toFixed(1),stability:+stab.toFixed(1),total:+(trend+indep+rs+stab).toFixed(1)};}
function synthFund(t,s){const rnd=rngFor("FUND:"+t);const price=s.at(-1).p;const gm=0.15+rnd()*0.55;return{name:t+" — "+(sectorOf(t)||"Global Infrastructure")+" Holdings",sector:sectorOf(t)||"Industrials",marketCap:3e8+Math.pow(rnd(),2)*2.7e12,price,avgVolume:Math.round(5e4+rnd()*2e7),grossMargin:gm,operMargin:gm*0.45,forwardPE:8+rnd()*32};}

async function llm(system,user,{model,temperature=0.7,json=false}={}){const st=state.settings;if(!st.key)return null;model=model||st.deep;for(let a=1;a<=3;a++){try{const body={model,messages:[{role:"system",content:system},{role:"user",content:user}],temperature,max_tokens:2048};if(json)body.response_format={type:"json_object"};const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+st.key},body:JSON.stringify(body)});if(r.status===429){await sleep(5000*a);continue;}if(!r.ok)continue;const d=await r.json();return (d.choices?.[0]?.message?.content||"").trim();}catch(e){await sleep(1500);}}return null;}

const HL=["13F filings show mega-cap managers adding to bottleneck suppliers","Congressional trading disclosure flags semiconductor equipment purchases","Sanctions enforcement tightens; freight rates on chemical tankers spike","CoWoS capacity remains sold out through next year","Helium-3 supply tightens as quantum programs scale","CDMO lead times stretch to 18 months on biotech demand","Transformer lead times exceed 100 weeks; grid buildout accelerates","Dark fleet rerouting disrupts refined product flows","Rare-earth export controls discussed; drone-motor makers scramble","Pharma glass capacity booked out; vial ecosystem at full utilization"];
function simReports(t,ind,fund,score){const rnd=rngFor("RPT:"+t);const pick=[0,1,2].map(()=>Math.floor(rnd()*HL.length));const newsScore=+(rnd()-0.4).toFixed(2);const sentScore=+(rnd()*1.1-0.5).toFixed(2);const geoScore=+(rnd()-0.2).toFixed(2);
return{technical:`Price $${ind.close.toFixed(2)} | SMA20/50/200 ${ind.sma20?.toFixed(2)}/${ind.sma50?.toFixed(2)}/${ind.sma200?.toFixed(2)}\nRSI14 ${ind.rsi?.toFixed(1)} — ${ind.rsi>70?"overbought":ind.rsi>55?"constructive momentum":ind.rsi>40?"neutral":"oversold"}\nMACD hist ${ind.hist>=0?"+":""}${ind.hist?.toFixed(2)}; ATR ${ind.atr?.toFixed(2)}\nKey Points Summary:\n• ${ind.close>ind.sma50?"Above":"Below"} 50-DMA, ${ind.close>ind.sma200?"above":"below"} 200-DMA\n• 5d ${ind.r5?.toFixed(1)}% / 20d ${ind.r20?.toFixed(1)}%\n• Ann. vol ${(ind.annVol*100).toFixed(0)}%`,
news:`Impact score: ${newsScore>=0?"+":""}${newsScore}\n• ${HL[pick[0]]}\n• ${HL[pick[1]]}\n• ${HL[pick[2]]}`,
sentiment:`Score: ${sentScore>=0?"+":""}${sentScore}\nCrowd ${sentScore>0.2?"constructive":sentScore<-0.2?"fearful (contrarian interest)":"mixed"}; shadow-supply-chain chatter ${geoScore>0.4?"elevated":"quiet"}.`,
fundamentals:`Gross margin ${(fund.grossMargin*100).toFixed(1)}% / op ${(fund.operMargin*100).toFixed(1)}% | Fwd P/E ${fund.forwardPE?.toFixed(1)} | Cap ${fmtMC(fund.marketCap)}\n${fund.grossMargin>0.4?"High margins = pricing power (bottleneck signal).":fund.forwardPE<15?"Modest valuation.":"Premium valuation requires durable growth."}`,
geopolitical:`Risk-premium score: ${geoScore>=0?"+":""}${geoScore}\n${geoScore>0.3?"Disruption WORSENING → bearish broad market, BULLISH for Shadow Alpha bottleneck assets. Flag explicitly.":"Disruption contained; risk premium modest."}`,
newsScore,sentScore,geoScore};}
function simPipeline(t,ind,fund,score,rpt){const rnd=rngFor("PIP:"+t);
const bull=`Momentum confirms: YTD ${score.ytd}% with SPY corr only ${score.correlation}. Gross margin ${(fund.grossMargin*100).toFixed(0)}% = pricing power. Geopolitical premium +${rpt.geoScore} accrues to choke-point owners. Independence ${score.independence}/25 = true alpha.`;
const bear=`Valuation risk: fwd P/E ${fund.forwardPE.toFixed(1)}. MDD ${score.max_dd}% and vol ${(ind.annVol*100).toFixed(0)}% imply a rough ride. RSI ${ind.rsi?.toFixed(0)} leaves ${ind.rsi>60?"overbought correction":"momentum doubt"} open.`;
const winBull=(score.total>=50&&score.ytd>=0);
const verdict={winner:winBull?"BULL":"BEAR",confidence:+(0.55+rnd()*0.35).toFixed(2),rationale:winBull?"Trend + independence + pricing power outweigh valuation.":"Risk/reward skewed by valuation and volatility."};
const buy=winBull&&score.total>=45;
const trader={action:buy?"BUY":(!winBull&&score.ytd<-10?"SELL":"HOLD"),position_pct:buy?clamp(10,100,Math.round(score.total+rnd()*20)):0,confidence:verdict.confidence,rationale:buy?"Accumulate physical bottleneck; uncorrelated alpha.":"Wait for better entry."};
const riskScore=clamp(1,10,Math.round(ind.annVol*20+Math.abs(score.max_dd)*0.15));
const risk={Aggressive:"Size up — asymmetry is the point.",Neutral:"Scale in; hedge with SPY puts.",Safe:"Drawdown "+score.max_dd+"% unacceptable at full size."};
const riskAdj={adjusted_action:riskScore>=8&&trader.action==="BUY"?"HOLD":trader.action,adjusted_position_pct:Math.round(trader.position_pct*(1-riskScore/25)),risk_score:riskScore,risk_notes:"Vol-scaled trim applied."};
const final={approved:true,final_action:riskAdj.adjusted_action,final_position_pct:riskAdj.adjusted_position_pct,notes:"Approved per 5-stage review. Shadow Alpha thesis "+(buy?"intact":"not confirmed")+"."};
return{verdict,bull,bear,risk,riskAdj,trader,final};}

async function runPipeline(t,onStage){const s=await getSeries(t);const spy=await getSeries("SPY");const ind=indicators(s);const fund=synthFund(t,s);const score=shadowAlphaScore(s,spy)||{total:0,ytd:0,correlation:0.5,max_dd:0};const rpt=simReports(t,ind,fund,score);
onStage(1,"I. ANALYST TEAM (5 agents)","running");const analysts={};
for(const[k,sys,data]of[["technical",P.TECH,JSON.stringify(ind)],["news",P.NEWS,"Headlines:\n"+HL.slice(0,4).map(h=>"• "+h).join("\n")],["sentiment",P.SENT,"Headlines: "+JSON.stringify(HL.slice(0,3))],["fundamentals",P.FUND,JSON.stringify(fund)],["geopolitical",P.GEOPOL,"Sector: "+fund.sector]]){analysts[k]=(AI()?await llm(sys,"Ticker: "+t+"\n"+data):null)||rpt[k];}
onStage(1,"I. ANALYST TEAM",Object.entries(analysts).map(([k,v])=>"— "+k.toUpperCase()+" —\n"+v).join("\n\n"));
onStage(2,"II. BULL vs BEAR DEBATE","running");const sp=simPipeline(t,ind,fund,score,rpt);
let bull=(AI()?await llm(P.BULL,"Reports:\n"+Object.values(analysts).join("\n").slice(0,1500)):null)||sp.bull;
let bear=(AI()?await llm(P.BEAR,"Reports:\n"+Object.values(analysts).join("\n").slice(0,1500)+"\nBULL says: "+bull):null)||sp.bear;
let verdict=(AI()?extractJSON(await llm(P.JUDGE,"[BULL]\n"+bull+"\n[BEAR]\n"+bear,{temperature:0.2,json:true})):null);verdict=verdict&&verdict.winner?verdict:sp.verdict;
onStage(2,"II. BULL vs BEAR + JUDGE","[BULL]\n"+bull+"\n\n[BEAR]\n"+bear+"\n\nVERDICT: "+verdict.winner+" (conf "+verdict.confidence+")\n"+(verdict.rationale||""));
onStage(3,"III. TRADER","running");
let trader=(AI()?extractJSON(await llm(P.TRADER,"Reports + verdict: "+verdict.winner,{temperature:0.3,json:true})):null);trader=trader&&trader.action?trader:sp.trader;
onStage(3,"III. TRADER",JSON.stringify(trader,null,1));
onStage(4,"IV. RISK MANAGEMENT TEAM","running");const risk={};
for(const[k,sys]of[["Aggressive",P.RISK_AGG],["Neutral",P.RISK_NEU],["Safe",P.RISK_SAFE]])risk[k]=(AI()?await llm(sys,"Trader plan: "+JSON.stringify(trader)):null)||sp.risk[k];
let riskAdj=(AI()?extractJSON(await llm(P.RISK_JUDGE,"TRADER: "+JSON.stringify(trader)+"\nRISK: "+Object.values(risk).join("\n"),{json:true})):null);riskAdj=riskAdj&&riskAdj.adjusted_action?riskAdj:sp.riskAdj;
onStage(4,"IV. RISK TEAM",Object.entries(risk).map(([k,v])=>"["+k+"] "+v).join("\n")+"\nADJUSTED: "+JSON.stringify(riskAdj));
onStage(5,"V. FUND MANAGER","running");
let final=(AI()?extractJSON(await llm(P.MANAGER,"TRADER: "+JSON.stringify(trader)+" RISK-ADJ: "+JSON.stringify(riskAdj),{json:true})):null);final=final&&final.final_action?final:sp.final;
onStage(5,"V. FUND MANAGER VERDICT",JSON.stringify(final,null,1));
memory.push({date:new Date().toISOString().slice(0,16).replace("T"," "),ticker:t,action:final.final_action,position_pct:final.final_position_pct,notes:String(final.notes||"").slice(0,200)});LS.set("saf_memory",memory);
return{ind,fund,score,verdict,trader,riskAdj,final};}

const br=d=>{let wr=0,n=0;for(const t in h){const r=periodReturn(cache[t],d);if(r!=null){wr+=r*(h[t]/tot);n++;}}return n?wr:null;};
let rows="";for(const t in h){const s=cache[t];rows+=`<tr data-ticker="${t}"><td><b>${t}</b></td><td class="r">${h[t].toFixed(1)} <span class="dim">(${Math.round(h[t]/tot*100)}%)</span></td><td class="r">$${s.at(-1).p.toFixed(2)}</td><td class="r">${fmtPct(periodReturn(s,1))}</td><td class="r">${fmtPct(periodReturn(s,30))}</td><td class="r">${fmtPct(periodReturn(s,"YTD"))}</td></tr>`;}
$("#mbody").innerHTML=`<div class="row" style="margin-bottom:12px"><span class="chip">1D ${fmtPct(br(1))}</span><span class="chip">1W ${fmtPct(br(7))}</span><span class="chip">1M ${fmtPct(br(30))}</span><span class="chip">YTD ${fmtPct(br("YTD"))}</span><span class="chip">${Object.keys(h).length} holdings</span></div>
<div class="tbl"><table><tr><th>Ticker (click for dossier)</th><th class="r">Weight</th><th class="r">Price</th><th class="r">1D</th><th class="r">1M</th><th class="r">YTD</th></tr>${rows}</table></div>`;}

${sc?`<div class="panel"><h3>Shadow Alpha score breakdown</h3><div class="kv"><b>Trend</b><span>${sc.trend}/25</span><b>Independence</b><span>${sc.independence}/25</span><b>Relative strength</b><span>${sc.rel_strength}/25</span><b>Stability</b><span>${sc.stability}/25</span></div></div>`:""}

if(!res){const rnd=rngFor("BOT:"+t);const ks=["market_concentration","substitutability","capital_intensity","regulatory_moat","demand_inelasticity","cross_sector_demand"];const sc=ks.map(k=>[k,1+Math.floor(rnd()*5)]);res={company_name:t,what_they_do:"Choke-point supplier",scores:Object.fromEntries(sc),total:sc.reduce((a,b)=>a+b[1],0),key_risk:"Substitution / demand shift"};saveAI("ai_bottleneck_analysis",{ticker:t,res});}
$("#r").innerHTML=`<div class="panel"><div class="kv"><b>Company</b><span>${res.company_name}</span><b>Does</b><span>${res.what_they_do}</span></div></div><table><tr><th>Criterion</th><th class="c">Score</th></tr>`+Object.entries(res.scores||{}).map(([k,v])=>`<tr><td>${k.replace(/_/g," ")}</td><td class="c" style="color:${v>=4?"var(--pos)":v>=3?"var(--hold)":"var(--neg)"};font-weight:700">${v}/5</td></tr>`).join("")+`<tr><td><b>TOTAL</b></td><td class="c"><b>${res.total}/30</b></td></tr></table><div class="panel ${res.total>=22?"buy":"sell"}" style="margin-top:8px"><h3>${res.total>=22?"🏆 TRUE BOTTLENECK (≥22)":"❌ BELOW THRESHOLD"}</h3>Key risk: ${res.key_risk||"—"}</div>`;};},
async adeep(){const out=$("#out");out.innerHTML=`<h2>🤖 AI Deep Report</h2><div class="row"><input id="tk" value="MKSI" style="width:110px"><button class="btn" id="go">Generate</button></div><div id="r"></div>`;
$("#go").onclick=async()=>{const t=$("#tk").value.toUpperCase().trim();const s=await getSeries(t);const sc=shadowAlphaScore(s,await getSeries("SPY"));const f=synthFund(t,s);$("#r").innerHTML=`<div class="panel"><span class="loader"></span> writing memo…</div>`;
let memo=AI()?await llm(P.DEEP,`Ticker: ${t}\nSCORE: ${JSON.stringify(sc)}\nFUNDAMENTALS: ${JSON.stringify(f)}`,{temperature:0.4}):null;
if(!memo){const v=sc.total>=55?"BUY":sc.total>=45?"WATCH":"SKIP";memo=`VERDICT: ${v}\nTHESIS: independence ${sc.independence}/25 & corr ${sc.correlation} → non-consensus driver.\nRISK: MDD ${sc.max_dd}%.\nCATALYST: disruption headline flow.\nSIZING: ${sc.total>=65?"2x":sc.total>=55?"1x":"0.5x"}\nGEOPOLITICAL ANGLE: benefits from supply-chain disruption.`;saveAI("ai_deep_report",{ticker:t,memo});}
$("#r").innerHTML=`<div class="panel buy"><pre class="memo">${memo}</pre></div>`;};}};

/* ═══ TRADINGAGENTS ═══ */
function renderAgents(){$("#main").innerHTML=`<div class="wrap">
<div class="card"><h1>⚛️ TradingAgents — 5-Stage Firm Simulation</h1><div class="sub">Analysts → Bull/Bear → Trader → Risk → Fund Manager · ${AI()?"Groq AI live":"deterministic SIM engine"}</div>
<div class="row"><input id="tk" value="NVDA" style="width:110px"><button class="btn gold" id="go">▶ Run Pipeline</button></div></div>
<div id="tl"></div>
<div class="card"><h2>📦 Batch Run by Basket</h2><div class="row"><select id="bk">${Object.keys(BASKETS).map(b=>`<option>${b}</option>`).join("")}<option>ALL</option></select><button class="btn" id="bgo">Run Batch</button></div><div class="sub" id="bprog"></div><div id="bres"></div></div></div>`;
$("#go").onclick=async()=>{const t=$("#tk").value.toUpperCase().trim();$("#tl").innerHTML="";
const res=await runPipeline(t,makeStages("tl","T"));
const a=res.final.final_action;const col=a==="BUY"?"buy":a==="SELL"?"sell":"hold";
$("#tl").insertAdjacentHTML("beforeend",`<div class="panel ${col}"><h3 style="font-size:18px">FINAL SIGNAL: ${a} · ${res.final.final_position_pct}% · Approved: ${res.final.approved}</h3><div class="sub">${res.final.notes||""}</div></div><div id="asg"></div>`);
await showAssignment(t,res,$("#asg"));};
$("#bgo").onclick=async()=>{const name=$("#bk").value;const list=name==="ALL"?uniqueTickers().slice(0,15):Object.keys(BASKETS[name]||{});const rows=[];
for(let i=0;i<list.length;i++){$("#bprog").innerHTML=`<span class="loader"></span> [${i+1}/${list.length}] ${list[i]}`;const r=await runPipeline(list[i],()=>{});rows.push({t:list[i],a:r.final.final_action,p:r.final.final_position_pct,w:r.verdict.winner});await sleep(50);}
$("#bprog").textContent=`BUY: ${rows.filter(r=>r.a==="BUY").length} | SELL: ${rows.filter(r=>r.a==="SELL").length} | HOLD: ${rows.filter(r=>r.a==="HOLD").length}`;
$("#bres").innerHTML=`<table><tr><th>#</th><th>Ticker</th><th class="c">Signal</th><th class="r">Size %</th><th class="c">Debate</th></tr>`+rows.map((r,i)=>`<tr data-ticker="${r.t}"><td>${i+1}</td><td><b>${r.t}</b></td><td class="c"><span class="sig ${r.a.toLowerCase()}">${r.a}</span></td><td class="r">${r.p}</td><td class="c">${r.w}</td></tr>`).join("")+`</table><br><button class="btn gold" id="bcsv">💾 Export batch CSV</button>`;
$("#bcsv").onclick=()=>downloadCSV("tradingagents_batch.csv",[["ticker","action","position_pct","debate"],...rows.map(r=>[r.t,r.a,r.p,r.w])]);};pills();}

/* ═══ MEMORY / DIAG / SETTINGS ═══ */
function renderMemory(){$("#main").innerHTML=`<div class="wrap"><div class="card"><h1>🧠 Trading Memory — Decision History</h1><div class="sub">${memory.length} recorded decisions · click a row for the dossier</div>
<table><tr><th>#</th><th>Date</th><th>Ticker</th><th class="c">Action</th><th class="r">Size %</th><th>Notes</th></tr>`+memory.slice(-30).map((r,i)=>`<tr data-ticker="${r.ticker}"><td>${i+1}</td><td>${r.date}</td><td><b>${r.ticker}</b></td><td class="c"><span class="sig ${String(r.action).toLowerCase()}">${r.action}</span></td><td class="r">${r.position_pct}</td><td>${(r.notes||"").slice(0,120)}</td></tr>`).join("")+`</table><br><button class="btn ghost" id="clr">🗑️ Clear memory</button></div></div>`;
$("#clr").onclick=()=>{memory.length=0;LS.set("saf_memory",memory);renderMemory();};}
async function renderDiag(){$("#main").innerHTML=`<div class="wrap"><div class="card"><h1>🧪 System Diagnostics</h1><div class="sub" id="dp">running…</div><div id="dt"></div></div></div>`;const R=[];
R.push(["Browser runtime",true,"JS engine operational"]);
let net=false;try{await fetch("https://api.groq.com",{mode:"no-cors",signal:AbortSignal.timeout(6000)});net=true;}catch(e){}
R.push(["Internet connectivity",net,net?"Groq/Yahoo reachable":"no connection"]);
let det="synthetic feed active (SIM)";if(net&&state.settings.live){const l=await fetchLive("SPY");det=l?"SPY live $"+l.at(-1).p.toFixed(2):"live fetch failed";}
R.push(["Market data feed",true,det]);
R.push(["GROQ_API_KEY present",AI(),AI()?"set":"NOT set — AI uses SIM"]);
if(AI()){const p=await llm("You are a test. Reply with the single word: OK","ping",{temperature:0});R.push(["DEEP model ("+state.settings.deep+")",!!p,(p||"").slice(0,30)||"empty"]);}else R.push(["AI models",false,"skipped — no key"]);
let w=true;try{localStorage.setItem("t","1");localStorage.removeItem("t");}catch(e){w=false;}
R.push(["localStorage write",w,"baskets/memory/universe persist"]);
R.push(["Basket config",true,Object.keys(BASKETS).length+" baskets, "+uniqueTickers().length+" tickers"]);
R.push(["Candidate universe",true,Object.keys(UNIVERSE).length+" sectors, "+universeTickers().length+" candidates"]);
const passed=R.filter(r=>r[1]).length;
$("#dt").innerHTML=`<table><tr><th>Check</th><th class="c">Status</th><th>Detail</th></tr>`+R.map(r=>`<tr><td>${r[0]}</td><td class="c">${r[1]?'<span class="sig pass">✅ PASS</span>':'<span class="sig fail">❌ FAIL</span>'}</td><td>${r[2]}</td></tr>`).join("")+`</table><div class="panel ${passed===R.length?"buy":"hold"}" style="margin-top:10px"><h3>HEALTH SCORE: ${passed}/${R.length} checks passed</h3></div>`;
$("#dp").textContent="complete";}
function renderSettings(){$("#main").innerHTML=`<div class="wrap"><div class="card"><h1>⚙️ Settings</h1>
<div class="panel"><div class="kv"><b>GROQ API KEY</b><span><input id="k" type="password" placeholder="gsk_…" style="width:320px" value="${state.settings.key||""}"> <button class="btn" id="show">👁</button></span>
<b>Deep model</b><span><input id="md" value="${state.settings.deep}" style="width:260px"></span>
<b>Fast model</b><span><input id="mf" value="${state.settings.fast}" style="width:260px"></span>
<b>Live market data</b><span><input type="checkbox" id="lv" ${state.settings.live?"checked":""}> pull Yahoo Finance (CORS proxy)</span></div>
<br><button class="btn gold" id="sv">💾 Save</button> <span class="dim">Key stored only in this browser.</span></div></div>
<div class="card"><h2>AI audit log</h2><div class="sub">${aiLog.length} entries</div><details><summary>View</summary><pre class="memo">${JSON.stringify(aiLog.slice(-10),null,1)}</pre></details></div></div>`;

pills();render();
